[project]
name = "extraction-agent"
version = "0.1.0"
description = "Agentic triage + deterministic extraction pipeline for mixed-format document intake"
requires-python = ">=3.11"
dependencies = [
    # langgraph/langchain-core are transitive deps of deepagents; not pinned
    # directly here so deepagents' own resolution picks compatible versions
    # (installed & verified against: deepagents 0.7.15, langchain-core 1.6.3,
    # langgraph 1.2.11).
    "deepagents>=0.7,<0.8",
    "pydantic>=2",
    "jsonschema>=4",
    "pyyaml>=6",
    "pandas>=2",
    "openpyxl>=3.1",
    "pypdf>=4",
    "python-docx>=1.1",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
